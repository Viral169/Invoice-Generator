name: MERN CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ========================
      # Backend (your case: backend/)
      # ========================
      - name: 📦 Install backend deps
        run: |
          cd backend
          npm install

      # ========================
      # Frontend (your case: frontend/)
      # ========================
      - name: 📦 Install frontend deps
        run: |
          cd frontend
          npm install

      - name: 🏗 Build frontend
        run: |
          cd frontend
          npm run build || echo "No build step"

      # ========================
      # Tests (optional)
      # ========================
      - name: 🧪 Backend test
        run: |
          cd backend
          npm test || echo "No backend tests"

      - name: 🧪 Frontend test
        run: |
          cd frontend
          npm test || echo "No frontend tests"
